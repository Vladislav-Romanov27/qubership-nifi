name: Apache NiFi Version Update
run-name: "Apache NiFi version update. On ${{ github.event_name }}"
on:
  workflow_dispatch:
    inputs:
      nifi-version:
        description: "Target Apache NiFi version, for example 2.12.0. Leave empty to pick the newest qualifying version."
        required: false
        type: string

permissions: {}

concurrency:
  group: maintenance-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new Apache NiFi version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      digest: ${{ steps.check.outputs.digest }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find Apache NiFi version to upgrade to
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_DAYS: "7"
          TARGET_VERSION: ${{ inputs.nifi-version }}
        run: bash .github/workflows/sh/nifi-version-check.sh

  # The agent runs here with a read-only token: the Maven build needs one for GitHub Packages.
  # The job hands its changes to pull-request as a patch, so the token that can push stays out
  # of reach of the agent.
  update:
    name: Upgrade Apache NiFi with nifi-upgrade-skill
    needs: check
    if: ${{ needs.check.outputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      OPENCODE_VERSION: '1.19.4'
      NIFI_VERSION: ${{ needs.check.outputs.version }}
      NIFI_DIGEST: ${{ needs.check.outputs.digest }}
      BRANCH: ${{ needs.check.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create branch
        run: git switch -c "$BRANCH"

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install opencode
        run: |
          npm install --global "opencode-ai@${OPENCODE_VERSION}"
          npm install --no-save --prefix .agent-tools yaml@2.9.1

      - name: Run nifi-upgrade-skill
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_FILE: upgrade-temp-data/pr-body.md
        run: bash .github/workflows/sh/nifi-upgrade-agent.sh

      # Runs even when the agent fails, because those are the runs the files help to debug.
      - name: Upload upgrade-temp-data
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-temp-data
          path: upgrade-temp-data/
          if-no-files-found: warn
          retention-days: 14

      - name: Save changes as a patch
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/nifi-upgrade"
          mkdir -p "$OUT_DIR"
          git add --all -- . ':!.agent-tools'
          if git diff --cached --quiet; then
            echo "::error::The agent made no changes for Apache NiFi $NIFI_VERSION."
            exit 1
          fi
          # The upgrade changes only text files, so a binary file in the change is rejected.
          # git diff --numstat prints "-" instead of line counts for a binary file.
          BINARY_FILES=$(git diff --cached --numstat | awk -F '\t' '$1 == "-" || $2 == "-" { print $3 }')
          if [ -n "$BINARY_FILES" ]; then
            echo "::error::The agent changed binary files, which the upgrade does not allow:"
            echo "$BINARY_FILES"
            exit 1
          fi
          git diff --cached --stat
          git diff --cached > "$OUT_DIR/changes.patch"
          if [ -s upgrade-temp-data/pr-body.md ]; then
            cp upgrade-temp-data/pr-body.md "$OUT_DIR/pr-body.md"
          fi

      - name: Upload patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nifi-upgrade
          path: ${{ runner.temp }}/nifi-upgrade/
          if-no-files-found: error

  pull-request:
    name: Open pull request
    needs: [check, update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      NIFI_VERSION: ${{ needs.check.outputs.version }}
      BRANCH: ${{ needs.check.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nifi-upgrade
          path: ${{ runner.temp }}/nifi-upgrade

      - name: Apply patch
        id: prepare
        run: |
          set -euo pipefail
          PATCH_FILE="$RUNNER_TEMP/nifi-upgrade/changes.patch"
          # This job can push, so it checks the patch again rather than trusting the update job.
          # git apply --numstat prints "-" instead of line counts for a binary file.
          BINARY_FILES=$(git apply --numstat "$PATCH_FILE" | awk -F '\t' '$1 == "-" || $2 == "-" { print $3 }')
          if [ -n "$BINARY_FILES" ]; then
            echo "::error::The patch changes binary files, which the upgrade does not allow:"
            echo "$BINARY_FILES"
            exit 1
          fi
          git apply "$PATCH_FILE"
          BODY_FILE="$RUNNER_TEMP/nifi-upgrade/pr-body.md"
          # Without the report the agent may have stopped partway, so the pull request opens as a draft.
          DRAFT=false
          if [ ! -s "$BODY_FILE" ]; then
            echo "The agent did not write a report. Review the changes against nifi-upgrade-skill manually." > "$BODY_FILE"
            DRAFT=true
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '\n---\n\nThe files of this run are in the upgrade-temp-data artifact of [workflow run %s](%s).\n' \
            "$GITHUB_RUN_ID" "$RUN_URL" >> "$BODY_FILE"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r '.model' .opencode/opencode.json)" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: ${{ env.BRANCH }}
          commit-message: |
            feat: upgrade nifi to ${{ env.NIFI_VERSION }}

            Assisted-by: opencode (${{ steps.prepare.outputs.model }})
          title: "feat: upgrade nifi to ${{ env.NIFI_VERSION }}"
          body-path: ${{ runner.temp }}/nifi-upgrade/pr-body.md
          draft: ${{ steps.prepare.outputs.draft }}
