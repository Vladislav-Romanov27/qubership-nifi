name: Apache NiFi Version Update
run-name: "Apache NiFi version update. On ${{ github.event_name }}"
on:
  workflow_dispatch:
    inputs:
      nifi-version:
        description: "Target Apache NiFi version"
        required: false
        type: string
  # schedule:
  #   - cron: "0 22 * * 6" # every Sunday 01:00 Moscow time (Saturday at 22:00 UTC)

permissions: {}

concurrency:
  group: maintenance-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new Apache NiFi version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      digest: ${{ steps.check.outputs.digest }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find Apache NiFi version to upgrade to
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_DAYS_PATCH: "7"
          MIN_AGE_DAYS_MINOR: "14"
          TARGET_VERSION: ${{ inputs.nifi-version }}
        run: bash .github/workflows/sh/nifi-version-check.sh

  # The agent runs here with a read-only token: the Maven build needs one for GitHub Packages.
  # The job hands its changes to pull-request as a patch, so the token that can push stays out
  # of reach of the agent.
  update:
    name: Upgrade Apache NiFi with nifi-upgrade-skill
    needs: check
    if: ${{ needs.check.outputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      OPENCODE_VERSION: '1.19.4'
      NIFI_VERSION: ${{ needs.check.outputs.version }}
      NIFI_DIGEST: ${{ needs.check.outputs.digest }}
      BRANCH: ${{ needs.check.outputs.branch }}
      REPORT_FILE: upgrade-temp-data/pr-body.md
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create branch
        run: git switch -c "$BRANCH"

      # The same cache as in maven-build.yaml, restored only. The agent runs Maven with commands it chooses, so
      # ~/.m2 after the run is not trusted, and saving it under the key that the other workflows restore would let
      # the agent change the dependencies of their builds.
      - name: Restore Maven dependencies
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install opencode
        run: npm install --global "opencode-ai@${OPENCODE_VERSION}"

      - name: Prepare reference data with Docker
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/workflows/sh/nifi-upgrade-prepare.sh

      # The agent runs as nifi-agent, which has no sudo rights and is not in the docker group, so it cannot read the
      # memory of the runner processes, use /var/run/docker.sock (root:docker 660), or change the files of the runner
      # user that later steps run.
      - name: Set up an unprivileged agent user
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /bin/bash nifi-agent
          # Keeps other users out of the workspace and of _temp, which holds the GITHUB_ENV and GITHUB_PATH files.
          sudo chmod 750 /home/runner
          sudo cp -a "$GITHUB_WORKSPACE/." /home/nifi-agent/repo/
          sudo install -d -m 700 /home/nifi-agent/.m2
          sudo cp ~/.m2/settings.xml /home/nifi-agent/.m2/settings.xml
          sudo cp -a ~/.m2/repository /home/nifi-agent/.m2/repository
          # The "Known issues analysis" step of the skill runs the nifi-jira-issue-analyst subagent from
          # .claude/agents/, which opencode does not read. opencode also rejects that header: its tools field is an
          # object. The agent gets the same text with an opencode header that allows only the read tool.
          AGENT_DIR=/home/nifi-agent/.config/opencode/agent
          sudo install -d "$AGENT_DIR"
          {
            printf -- '---\ndescription: %s %s\nmode: subagent\npermission:\n  "*": deny\n  read: allow\n---\n' \
              'Classifies Apache NiFi Jira issues from a local JSON file.' \
              'Use only from the "Known issues analysis" step of nifi-upgrade-skill.'
            awk 'n >= 2 { print } /^---\r?$/ { n++ }' .claude/agents/nifi-jira-issue-analyst.md
          } | sudo tee "$AGENT_DIR/nifi-jira-issue-analyst.md" > /dev/null
          sudo chown -R nifi-agent:nifi-agent /home/nifi-agent/repo /home/nifi-agent/.m2 /home/nifi-agent/.config

      - name: Check the isolation of the agent user
        run: |
          set -uo pipefail
          AGENT_PATH="$JAVA_HOME/bin:/usr/local/bin:/usr/bin:/bin"
          fail() { echo "::error::$1"; exit 1; }
          sudo -u nifi-agent sudo -n true 2> /dev/null && fail "nifi-agent can run sudo"
          sudo -u nifi-agent docker info > /dev/null 2>&1 && fail "nifi-agent can use Docker"
          PID=$(pgrep -f Runner.Worker | head -1)
          sudo -u nifi-agent cat "/proc/$PID/environ" > /dev/null 2>&1 && fail "nifi-agent can read Runner.Worker"
          sudo -u nifi-agent ls /home/runner/work > /dev/null 2>&1 && fail "nifi-agent can read the runner home"
          sudo -u nifi-agent env PATH="$AGENT_PATH" bash -c 'command -v java mvn opencode' \
            || fail "nifi-agent cannot find java, mvn, or opencode"
          echo "The agent user is isolated and has its tools."

      - name: Run nifi-upgrade-skill
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REPORT_FILE: upgrade-temp-data/pr-body.md
        run: |
          export CI=true AGENT_PATH="$JAVA_HOME/bin:/usr/local/bin:/usr/bin:/bin"
          # --preserve-env with a list passes these variables through the environment: a value on the sudo
          # command line shows in ps to every user while sudo runs. sudo replaces PATH with secure_path, so
          # AGENT_PATH carries it. XDG_CONFIG_HOME of the runner still reaches the agent and points into
          # /home/runner, which nifi-agent cannot write, so the XDG directories are set to its own home.
          sudo -u nifi-agent -H \
            --preserve-env=CI,JAVA_HOME,AGENT_PATH,NIFI_VERSION,NIFI_DIGEST,REPORT_FILE,GITHUB_ACTOR,GITHUB_TOKEN,OPENCODE_API_KEY \
            bash -c 'export PATH="$AGENT_PATH" XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share" \
                XDG_CACHE_HOME="$HOME/.cache" XDG_STATE_HOME="$HOME/.local/state"
              cd ~/repo && exec bash .github/workflows/sh/nifi-upgrade-agent.sh'

      - name: Copy the changes of the agent back
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # A symlink from the agent could point at a file of the runner user, which upload-artifact would then read
          # and publish. The patch may not contain symlinks anyway.
          LINKS=$(sudo find /home/nifi-agent/repo -path '*/.git' -prune -o -type l -print)
          if [ -n "$LINKS" ]; then
            echo "::error::The agent created symlinks, which the upgrade does not allow:"
            echo "$LINKS"
            exit 1
          fi
          # .git is not copied: the next steps run git as the runner user, and a .git/config or a hook that the agent
          # wrote, such as core.fsmonitor or core.hooksPath, would run code as that user.
          sudo rsync -a --delete --exclude=.git /home/nifi-agent/repo/ "$GITHUB_WORKSPACE/"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      # Runs before any upload, and even when the agent fails, so that the key leaves the job in neither an
      # artifact nor the patch. The agent could have changed the script in the working tree, so it runs as of the
      # commit of this run.
      - name: Check that the changes do not contain OPENCODE_API_KEY
        id: secret-check
        if: ${{ always() }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          SCRIPT="$RUNNER_TEMP/nifi-upgrade-check-secret.sh"
          git show "$GITHUB_SHA:.github/workflows/sh/nifi-upgrade-check-secret.sh" > "$SCRIPT"
          bash "$SCRIPT"

      # Runs even when the agent fails, because those are the runs the files help to debug, but not when the files
      # contain OPENCODE_API_KEY.
      - name: Upload upgrade-temp-data
        if: ${{ always() && steps.secret-check.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-temp-data
          path: |
            upgrade-temp-data/
            !upgrade-temp-data/nifi-property-exports/
            !upgrade-temp-data/nifi-helper-pom.xml
            !upgrade-temp-data/releases-notes/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release notes
        if: ${{ always() && steps.secret-check.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: upgrade-temp-data/releases-notes/
          if-no-files-found: warn
          retention-days: 14

      # The agent could have changed the scripts in the working tree, so they run as of the commit of this run.
      - name: Save changes as a patch
        env:
          OUT_DIR: ${{ runner.temp }}/nifi-upgrade
        run: |
          set -euo pipefail
          SCRIPTS_DIR="$RUNNER_TEMP/nifi-upgrade-scripts"
          mkdir -p "$SCRIPTS_DIR"
          for script in nifi-upgrade-checks.sh nifi-upgrade-save-patch.sh; do
            git show "$GITHUB_SHA:.github/workflows/sh/$script" > "$SCRIPTS_DIR/$script"
          done
          bash "$SCRIPTS_DIR/nifi-upgrade-save-patch.sh"

      - name: Upload patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nifi-upgrade
          path: ${{ runner.temp }}/nifi-upgrade/
          if-no-files-found: error
          retention-days: 1

  pull-request:
    name: Open pull request
    needs: [check, update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      NIFI_VERSION: ${{ needs.check.outputs.version }}
      BRANCH: ${{ needs.check.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nifi-upgrade
          path: ${{ runner.temp }}/nifi-upgrade

      - name: Apply patch
        id: prepare
        env:
          PATCH_DIR: ${{ runner.temp }}/nifi-upgrade
        run: bash .github/workflows/sh/nifi-upgrade-apply-patch.sh

      # token, author, and committer keep the defaults of the action:
      # - token is GITHUB_TOKEN. Events from it start no workflow runs on their own, so the CI workflows of the
      #   pull request wait for a maintainer to approve them in the pull request before they run.
      # - author is the user who triggered the workflow run, github.actor; for a scheduled run, that is the user
      #   who last changed the schedule.
      # - committer is the GitHub Actions bot, github-actions[bot].
      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: ${{ env.BRANCH }}
          commit-message: |
            feat: upgrade nifi to ${{ env.NIFI_VERSION }}

            Assisted-by: opencode (${{ steps.prepare.outputs.model }})
          title: "feat: upgrade nifi to ${{ env.NIFI_VERSION }}"
          body-path: ${{ runner.temp }}/nifi-upgrade/pr-body.md
          draft: ${{ steps.prepare.outputs.draft }}
